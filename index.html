<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dfe4e8">
<title>Пикетный столбик — по альбому</title>
<style>
  @font-face { font-family:'Russo One'; src:url('fonts/RussoOne-Regular.ttf'); font-display:block; }
  @font-face { font-family:'Oswald'; src:url('fonts/Oswald.ttf'); font-weight:300 700; font-display:block; }
  @font-face { font-family:'Ruslan Display'; src:url('fonts/RuslanDisplay-Regular.ttf'); font-display:block; }

  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; font-family:-apple-system,Arial,Helvetica,sans-serif;
              background:linear-gradient(180deg,#f4f6f7 0%,#dfe4e8 55%,#ccd2d7 100%);
              -webkit-user-select:none; user-select:none; overscroll-behavior:none; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }

  /* верхняя плашка */
  .top { position:fixed; left:0; right:0; top:0; padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
         display:flex; align-items:center; gap:10px; pointer-events:none; z-index:3; }
  .top h1 { margin:0; font-size:15px; font-weight:800; color:#1b2024; letter-spacing:.01em; }
  .top .sub { font-size:12px; color:#5d646b; margin-top:1px; }

  /* нижняя панель управления */
  .bar { position:fixed; left:0; right:0; bottom:0; z-index:4;
         padding:6px 12px calc(env(safe-area-inset-bottom) + 12px);
         background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.92) 30%);
         backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
         border-top:1px solid rgba(170,178,185,.5); border-radius:18px 18px 0 0;
         box-shadow:0 -12px 30px rgba(30,36,42,.16);
         transform:translateY(120%); transition:transform .28s cubic-bezier(.4,0,.2,1); }
  body.panel-open .bar { transform:translateY(0); }
  .handle { width:44px; height:5px; border-radius:99px; background:#c4c9ce; margin:4px auto 8px; }
  .settings-btn { position:fixed; left:50%; transform:translateX(-50%); z-index:5;
         bottom:calc(env(safe-area-inset-bottom) + 16px); height:48px; padding:0 24px;
         border-radius:24px; border:1px solid rgba(170,178,185,.6); background:rgba(255,255,255,.9);
         backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
         font-size:15px; font-weight:700; color:#1b2024; box-shadow:0 6px 18px rgba(30,36,42,.18); }
  body.panel-open .settings-btn { display:none; }
  .bar .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; max-width:560px; margin:0 auto; }
  .field { display:flex; flex-direction:column; gap:3px; }
  .field.city { grid-column:1 / -1; }
  .field label { font-size:11px; font-weight:700; color:#7c828a; text-transform:uppercase; letter-spacing:.05em; padding-left:2px; }
  select { appearance:none; width:100%; height:48px; border:1px solid #b9bfc5; background:#fff; color:#11151a;
           border-radius:12px; padding:0 36px 0 13px; font-size:16px; font-weight:600;
           background-image:linear-gradient(45deg,transparent 50%,#697079 50%),linear-gradient(135deg,#697079 50%,transparent 50%);
           background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px; background-size:6px 6px,6px 6px; background-repeat:no-repeat; }
  select:active { background-color:#f3f5f6; }

  .reset { position:fixed; right:14px; z-index:4; bottom:calc(env(safe-area-inset-bottom) + 150px);
           width:46px; height:46px; border-radius:50%; border:1px solid rgba(170,178,185,.6);
           background:rgba(255,255,255,.85); backdrop-filter:blur(8px); font-size:20px; color:#3a4047;
           display:flex; align-items:center; justify-content:center; pointer-events:auto; }

  .loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; gap:10px;
             font-size:14px; color:#5d646b; background:linear-gradient(180deg,#f4f6f7,#d9dee2); z-index:9; }
  .spin { width:18px; height:18px; border:2px solid #c2c8ce; border-top-color:#6a7178; border-radius:50%; animation:s .8s linear infinite; }
  @keyframes s { to { transform:rotate(360deg); } }

  /* десктоп: контролы вправо, столбиком */
  @media (min-width:760px) and (pointer:fine) {
    .bar { left:auto; right:18px; top:50%; bottom:auto; transform:translateY(-50%)!important;
           width:250px; border:1px solid rgba(170,178,185,.55); border-radius:16px;
           background:rgba(255,255,255,.8); padding:14px; box-shadow:0 10px 30px rgba(30,36,42,.12); }
    .bar .grid { grid-template-columns:1fr; gap:11px; }
    .field.city { grid-column:auto; }
    .handle, .settings-btn { display:none; }
    .top h1 { font-size:19px; } .top .sub { font-size:13px; }
    .reset { right:288px; bottom:auto; top:calc(50% + 132px); }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="top">
  <div>
    <h1>Пикетный столбик · по альбому</h1>
    <div class="sub" id="sub">Чёрно-белый, розетка под бетон</div>
  </div>
</div>

<button class="reset" id="reset" title="Сбросить вид" aria-label="Сбросить вид">⟲</button>
<button class="settings-btn" id="settingsBtn">⚙ Настройки</button>

<div class="bar">
  <div class="handle" id="barHandle" title="Скрыть настройки"></div>
  <div class="grid">
    <div class="field"><label>Розетка</label>
      <select id="rosette">
        <option value="concrete">Бетон</option>
        <option value="granite">Гранит тёмный</option>
        <option value="steelbase">Сталь</option>
      </select>
    </div>
    <div class="field"><label>Шрифт</label>
      <select id="font">
        <option value="russo">Russo One (РФ)</option>
        <option value="oswald">Oswald (узкий)</option>
        <option value="ruslan">Древнерусский</option>
      </select>
    </div>
    <div class="field"><label>Надпись</label>
      <select id="layout">
        <option value="rosette">Город на розетке</option>
        <option value="arc">Город дугой (по периметру)</option>
        <option value="post">Город на столбике (бел., вертик.)</option>
      </select>
    </div>
    <div class="field"><label>Размер надписи</label>
      <select id="scale">
        <option value="1">Обычный</option>
        <option value="1.25">Крупнее</option>
        <option value="1.5">Максимум</option>
      </select>
    </div>
    <div class="field city"><label>Город</label>
      <select id="city"></select>
    </div>
  </div>
</div>

<div class="loading" id="loading"><span class="spin"></span> Загрузка…</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './vendor/jsm/controls/OrbitControls.js';
import { RoomEnvironment } from './vendor/jsm/environments/RoomEnvironment.js';

// ---------- данные ----------
const cities = [
  ['Новосибирск',3336],['Чита',6194],['Ярославль',282],['Красноярск',4097],
  ['Иркутск',5180],['Москва',0],['Санкт-Петербург',0],['Н.Новгород',440],['Самара',1099],
  ['Воронеж',578],['Хабаровск',8522],['Ростов-на-Дону',1223],['Екатеринбург',1814],
  ['Челябинск',2109],['Калининград',1285],['Саратов',855]
];
const FONTS = { russo:'Russo One', oswald:'Oswald', ruslan:'Ruslan Display' };

// раскраска розетки (бетон + альтернативы). textCity — цвет надписи (без белого канта).
const ROSETTE = {
  concrete:  { name:'Бетон',         color:0xb4b1a7, metalness:0.0,  roughness:0.95, clearcoat:0,   env:0.45, textCity:'#111111' },
  granite:   { name:'Гранит тёмный', color:0x33353a, metalness:0.15, roughness:0.42, clearcoat:0.5, env:0.8,  textCity:'#ece8df' },
  steelbase: { name:'Сталь',         color:0xcdd2d7, metalness:1.0,  roughness:0.3,  clearcoat:0,   env:1.5,  textCity:'#15181c' }
};
// чёрно-белые поля столбика по «Предельному столбику» (рис.13), пропорции 170:250
const ALB = { white:95, black:145, ink:'#15161a', paper:'#f1efe7' };

// ---------- размеры (мм) ----------
const D = { R:175, band:25, cone:25, post:60, postStraight:255, pyr:45 };
D.base = D.band + D.cone; D.postTop = D.base + D.postStraight; D.apex = D.postTop + D.pyr;

// ---------- состояние ----------
const params = new URLSearchParams(location.search);
const state = {
  font:    params.get('font') || 'russo',
  city:    params.get('city') != null ? +params.get('city') : 0,
  rosette: params.get('rosette') || 'concrete',
  layout:  params.get('layout') || 'rosette',   // rosette | arc | post
  scale:   +(params.get('scale') || 1)
};
const headless = params.get('headless') === '1';

// ---------- three ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, preserveDrawingBuffer:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
(function(){ const cv=document.createElement('canvas'); cv.width=16; cv.height=256;
  const g=cv.getContext('2d'); const grd=g.createLinearGradient(0,0,0,256);
  grd.addColorStop(0,'#f4f6f7'); grd.addColorStop(0.55,'#dfe4e8'); grd.addColorStop(1,'#ccd2d7');
  g.fillStyle=grd; g.fillRect(0,0,16,256);
  const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace; scene.background=t; })();

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(34, 1, 1, 6000);
const target = new THREE.Vector3(0, 168, 0);
const controls = new OrbitControls(camera, canvas);
controls.target.copy(target);
controls.enableDamping = true; controls.dampingFactor = 0.09;
controls.enablePan = false;
controls.minDistance = 300; controls.maxDistance = 1500;
controls.minPolarAngle = 0.15; controls.maxPolarAngle = Math.PI * 0.52;
controls.rotateSpeed = 0.9; controls.zoomSpeed = 0.9;

const DEFAULT_VIEW = { az:0.62, el:0.40 };
function applyView(az, el, dist){
  camera.position.set(
    target.x + dist*Math.cos(el)*Math.sin(az),
    target.y + dist*Math.sin(el),
    target.z + dist*Math.cos(el)*Math.cos(az));
  camera.lookAt(target); controls.update();
}
// кадрирование под ориентацию: на телефоне (портрет) приподнимаем модель над нижней панелью
function defaultFrame(){
  const portrait = innerHeight >= innerWidth;
  const open = document.body.classList.contains('panel-open');
  const lift = portrait && open;             // приподнимаем модель только при открытой панели
  target.set(0, lift ? 150 : 168, 0); controls.target.copy(target);
  applyView(DEFAULT_VIEW.az, DEFAULT_VIEW.el, portrait ? (open ? 1020 : 950) : 860);
}

// ---------- свет + тень ----------
const key = new THREE.DirectionalLight(0xffffff, 2.1);
key.position.set(260,520,340); key.castShadow = true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.near=50; key.shadow.camera.far=1600;
key.shadow.camera.left=-340; key.shadow.camera.right=340; key.shadow.camera.top=340; key.shadow.camera.bottom=-340;
key.shadow.bias=-0.0006; key.shadow.radius=6; scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.5); fill.position.set(-300,220,-160); scene.add(fill);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(3000,3000), new THREE.ShadowMaterial({ opacity:0.26 }));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

// ---------- модель ----------
let modelGroup = new THREE.Group(); scene.add(modelGroup);

function buildModel(){
  scene.remove(modelGroup);
  modelGroup.traverse(o=>{ if(o.geometry) o.geometry.dispose(); if(o.material){ const m=o.material; (Array.isArray(m)?m:[m]).forEach(x=>{ if(x.map) x.map.dispose(); x.dispose&&x.dispose(); }); } });
  modelGroup = new THREE.Group();

  const R = ROSETTE[state.rosette] || ROSETTE.concrete;
  const sc = state.scale || 1;
  const rosetteMat = new THREE.MeshPhysicalMaterial({ color:R.color, metalness:R.metalness, roughness:R.roughness,
    clearcoat:R.clearcoat||0, clearcoatRoughness:0.3, envMapIntensity:R.env||1 });
  const matte = c => new THREE.MeshStandardMaterial({ color:c, metalness:0, roughness:0.82, envMapIntensity:0.35 });
  const blackM = matte(ALB.ink);
  const [name, km] = cities[state.city];
  const fam = FONTS[state.font] || FONTS.forum;
  const cityVert = state.layout==='post' ? name.toLocaleUpperCase('ru-RU') : null;  // город вертикально на столбике
  const texMat = withNum => new THREE.MeshStandardMaterial({ map:postBWTexture(km, fam, withNum, cityVert, sc), metalness:0, roughness:0.82, envMapIntensity:0.35 });
  // грани BoxGeometry: [+X,-X,+Y,-Y,+Z,-Z]
  const postMat = [ texMat(false), texMat(false), blackM, blackM, texMat(true), texMat(true) ];

  const band = new THREE.Mesh(new THREE.CylinderGeometry(D.R,D.R,D.band,128), rosetteMat);
  band.position.y=D.band/2; band.castShadow=band.receiveShadow=true; modelGroup.add(band);

  const cone = new THREE.Mesh(new THREE.CylinderGeometry(42,D.R,D.cone,128), rosetteMat);
  cone.position.y=D.band+D.cone/2; cone.castShadow=cone.receiveShadow=true; modelGroup.add(cone);

  const post = new THREE.Mesh(new THREE.BoxGeometry(D.post,D.postStraight,D.post), postMat);
  post.position.y=D.base+D.postStraight/2; post.castShadow=post.receiveShadow=true; modelGroup.add(post);

  // пирамидальная заточка по фото: невысокая (~45 мм), почти острый кончик, чуть сглаженный шлифовкой
  const pyr = new THREE.Mesh(new THREE.CylinderGeometry(5, D.post/Math.SQRT2, D.pyr, 4), blackM);
  pyr.position.y=D.postTop+D.pyr/2; pyr.rotation.y=Math.PI/4; pyr.castShadow=true; modelGroup.add(pyr);

  const weld = new THREE.Mesh(new THREE.TorusGeometry(D.post/2+3,4.5,12,48), matte(ALB.ink));
  weld.position.y=D.base+2; weld.rotation.x=Math.PI/2; weld.castShadow=true; modelGroup.add(weld);

  if(state.layout==='rosette') addCityDecal(R, name, fam, sc);
  else if(state.layout==='arc') addCityArc(R, name, fam, sc);
  scene.add(modelGroup);
}

// текстура грани: белое поле сверху + чёрный низ; при withNum — чёрный км в белом поле,
// при cityVert — город белым вертикально в чёрном поле.
function postBWTexture(km, fam, withNum, cityVert, sc){
  sc = sc||1;
  const w=160, h=640; const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  const g=cv.getContext('2d'); const split=h*ALB.white/(ALB.white+ALB.black);
  g.fillStyle=ALB.paper; g.fillRect(0,0,w,split);
  g.fillStyle=ALB.ink;   g.fillRect(0,split,w,h-split);
  if(withNum){ g.fillStyle=ALB.ink; g.textAlign='center'; g.textBaseline='middle';
    let size=Math.round(86*sc); g.font=`700 ${size}px "${fam}"`;
    while(g.measureText(String(km)).width>w-22 && size>26){ size-=2; g.font=`700 ${size}px "${fam}"`; }
    g.fillText(String(km), w/2, split*0.46);
    g.font=`${Math.round(size*0.34)}px "${fam}"`; g.fillText('км', w/2, split*0.46+size*0.52);
    if(cityVert){
      g.save(); g.fillStyle=ALB.paper; g.textAlign='center'; g.textBaseline='middle';
      g.translate(w/2, split+(h-split)/2); g.rotate(-Math.PI/2);
      let cs=Math.round(40*sc); g.font=`${cs}px "${fam}"`;
      while(g.measureText(cityVert).width>(h-split)-34 && cs>13){ cs-=1; g.font=`${cs}px "${fam}"`; }
      g.fillText(cityVert, 0, 0); g.restore();
    }
  }
  const t=new THREE.CanvasTexture(cv); t.anisotropy=8; t.colorSpace=THREE.SRGBColorSpace; return t;
}

// город прямой строкой на переднем склоне розетки (без белого канта, чисто цветом)
function addCityDecal(R, name, fam, sc){
  sc = sc||1;
  const W=250, H=54, s=4;
  const cv=document.createElement('canvas'); cv.width=W*s; cv.height=H*s;
  const g=cv.getContext('2d'); g.scale(s,s);
  g.textAlign='center'; g.textBaseline='middle';
  let size=42; g.font=`${size}px "${fam}"`; const up=name.toLocaleUpperCase('ru-RU');
  while(g.measureText(up).width>W-20 && size>15){ size-=1; g.font=`${size}px "${fam}"`; }
  g.fillStyle=R.textCity; g.fillText(up,W/2,H/2);
  const tex=new THREE.CanvasTexture(cv); tex.anisotropy=8; tex.colorSpace=THREE.SRGBColorSpace;
  const mat=new THREE.MeshStandardMaterial({ map:tex, transparent:true, roughness:0.6, metalness:0,
    polygonOffset:true, polygonOffsetFactor:-6, polygonOffsetUnits:-6, depthWrite:false });
  const pw=Math.min(312, 200*sc);
  const plane=new THREE.Mesh(new THREE.PlaneGeometry(pw, pw*H/W), mat);
  plane.position.set(0,36.5,112); plane.rotation.x=-(Math.PI/2)+0.30; plane.renderOrder=2;
  modelGroup.add(plane);
}

// город «дугой по периметру» — обёрнут вокруг конуса розетки
function addCityArc(R, name, fam, sc){
  sc = sc||1;
  const W=4096, H=512; const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const g=cv.getContext('2d'); g.clearRect(0,0,W,H);
  g.textAlign='center'; g.textBaseline='middle'; g.fillStyle=R.textCity;
  let size=Math.round(230*sc); g.font=`${size}px "${fam}"`; const up=name.toLocaleUpperCase('ru-RU');
  while(g.measureText(up).width>W*0.46 && size>60){ size-=4; g.font=`${size}px "${fam}"`; }
  g.fillText(up, W*0.5, H*0.46);                 // перёд розетки = центр развёртки конуса
  const tex=new THREE.CanvasTexture(cv); tex.anisotropy=8; tex.colorSpace=THREE.SRGBColorSpace;
  tex.wrapS=THREE.ClampToEdgeWrapping; tex.wrapT=THREE.ClampToEdgeWrapping;
  const mat=new THREE.MeshStandardMaterial({ map:tex, transparent:true, roughness:0.6, metalness:0, side:THREE.DoubleSide,
    polygonOffset:true, polygonOffsetFactor:-8, polygonOffsetUnits:-8, depthWrite:false });
  const shell=new THREE.Mesh(new THREE.CylinderGeometry(42.4, D.R+0.5, D.cone, 160, 1, true), mat);
  shell.position.y=D.band+D.cone/2; shell.rotation.y=Math.PI;   // шов на заднюю сторону, перёд = центр текстуры
  shell.renderOrder=2; modelGroup.add(shell);
}

// ---------- UI ----------
const citySel=document.getElementById('city');
cities.forEach(([n,k],i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=`${n}${k?(' · '+k+' км'):''}`; citySel.appendChild(o); });
document.getElementById('rosette').value=state.rosette;
document.getElementById('font').value=state.font;
document.getElementById('layout').value=state.layout;
document.getElementById('scale').value=String(state.scale);
citySel.value=state.city;
function updateSub(){ const R=ROSETTE[state.rosette]||ROSETTE.concrete; const [n,k]=cities[state.city];
  document.getElementById('sub').textContent=`Розетка: ${R.name} · ${n}${k?(' · '+k+' км'):''}`; }
function rebuild(){ buildModel(); updateSub(); }
document.getElementById('rosette').addEventListener('change',e=>{ state.rosette=e.target.value; rebuild(); });
document.getElementById('font').addEventListener('change',e=>{ state.font=e.target.value; rebuild(); });
document.getElementById('layout').addEventListener('change',e=>{ state.layout=e.target.value; rebuild(); });
document.getElementById('scale').addEventListener('change',e=>{ state.scale=+e.target.value; rebuild(); });
citySel.addEventListener('change',e=>{ state.city=+e.target.value; rebuild(); });
document.getElementById('reset').addEventListener('click',()=>{ defaultFrame(); });
// выезжающая панель настроек (телефон)
function setPanel(open){ document.body.classList.toggle('panel-open', open); defaultFrame(); }
document.getElementById('settingsBtn').addEventListener('click',()=>setPanel(true));
document.getElementById('barHandle').addEventListener('click',()=>setPanel(false));
// тап по 3D-сцене (без вращения) — скрыть настройки
let tapStart=null;
canvas.addEventListener('pointerdown', e=>{ tapStart={x:e.clientX,y:e.clientY,t:performance.now()}; });
canvas.addEventListener('pointerup', e=>{
  if(!tapStart) return;
  const moved=Math.hypot(e.clientX-tapStart.x, e.clientY-tapStart.y);
  const dt=performance.now()-tapStart.t;
  if(moved<8 && dt<300 && document.body.classList.contains('panel-open')) setPanel(false);
  tapStart=null;
});

// ---------- запуск ----------
function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();
function animate(){ controls.update(); renderer.render(scene,camera); requestAnimationFrame(animate); }

async function start(){
  try { await Promise.race([ Promise.all(Object.values(FONTS).map(f=>document.fonts.load(`40px "${f}"`))), new Promise(r=>setTimeout(r,2500)) ]); } catch(e){}
  try { buildModel(); updateSub(); if(headless) document.title='OK built'; }
  catch(e){ document.title='ERR '+(e&&e.message||e); throw e; }
  document.getElementById('loading').style.display='none';
  const v=params.get('view');
  if(v==='front') applyView(0.0,0.16,780);
  else if(v==='top') applyView(0.5,0.85,900);
  else defaultFrame();
  if(params.get('panel')==='open') setPanel(true);
  if(headless){
    document.querySelector('.top').style.display='none'; document.querySelector('.bar').style.display='none'; document.getElementById('reset').style.display='none';
    let n=0;(function loop(){ try{ n++; controls.update(); renderer.render(scene,camera);}catch(e){ document.title='RENDERERR '+e.message; window.__ready=true; return; }
      if(n<4) requestAnimationFrame(loop);
      else { try{ const url=renderer.domElement.toDataURL('image/png'); const el=document.createElement('div'); el.id='__png'; el.style.display='none'; el.textContent='PNGSTART'+url+'PNGEND'; document.body.appendChild(el); document.title='SHOT ok '+url.length; }catch(e){ document.title='SHOTERR '+e.message; } window.__ready=true; } })();
  } else { animate(); }
}
start();
</script>
</body>
